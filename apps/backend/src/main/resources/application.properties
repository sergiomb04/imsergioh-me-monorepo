spring.main.web-application-type=servlet
server.port=${PORT:8081}
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# MariaDB Datasource Configuration
spring.datasource.url=${DB_URL:jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:analytics}?useUnicode=true&characterEncoding=utf8&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# Analytics Cache and Inactivity Configuration (5 minutes = 300000 ms)
analytics.cache.inactive-timeout-ms=300000
analytics.cache.check-interval-ms=30000